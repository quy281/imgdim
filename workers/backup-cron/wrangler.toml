name = "mkg-khaosat-backup-cron"
main = "src/index.js"
compatibility_date = "2026-01-01"

[triggers]
# Chay tu dong luc 02:00 sang gio Viet Nam (19:00 UTC) hang ngay
crons = ["0 19 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mkg-khaosat-db"
database_id = "813b8317-c182-44fa-8d87-76519fc0225c"

# Bo comment khoi nay sau khi bat R2 tren Dashboard va chay: node scripts/cf-setup.mjs --provision
