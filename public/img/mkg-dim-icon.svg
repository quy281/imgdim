<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- measurement ticks top -->
  <line x1="13" y1="19" x2="87" y2="19" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <line x1="13" y1="14" x2="13" y2="24" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <line x1="87" y1="14" x2="87" y2="24" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <!-- arrow heads -->
  <polyline points="19,15 13,19 19,23" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <polyline points="81,15 87,19 81,23" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <!-- MKG text -->
  <text x="50" y="69" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="40" fill="white" text-anchor="middle" letter-spacing="-1">MKG</text>
  <!-- DIM label -->
  <text x="50" y="87" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="5">DIM</text>
</svg>
