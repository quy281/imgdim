<!doctype html>
<meta charset="utf-8">
<title>user layer selftest</title>
<style>
    body { font: 13px/1.6 ui-monospace, monospace; padding: 16px; }
    .FAIL { color: #dc2626; font-weight: 700; }
    .PASS { color: #16a34a; }
    h3 { margin: 18px 0 4px; font-family: system-ui; }
</style>
<pre id="out">running…</pre>
<script type="module">
    // Lớp user: mỗi tài khoản một IndexedDB riêng. Test kiểm đúng ba việc:
    //   1. Dữ liệu tạo lúc chưa đăng nhập được NHẬN vào tài khoản đầu tiên.
    //   2. Tài khoản khác đăng nhập trên cùng máy KHÔNG thấy dữ liệu của người trước.
    //   3. Đăng xuất không làm mất dữ liệu đang xem.
    import * as db from '/src/lib/db.js';

    const lines = [];
    let pass = 0, fail = 0;
    const ok = (name, cond, extra = '') => {
        cond ? pass++ : fail++;
        lines.push(`<span class="${cond ? 'PASS' : 'FAIL'}">${cond ? 'PASS' : 'FAIL'}</span>  ${name}${extra && !cond ? ` — ${extra}` : ''}`);
    };
    const group = (t) => lines.push(`<h3>${t}</h3>`);

    // Dọn sạch trước khi chạy để test tái lập được.
    const U1 = 'utest_user_1', U2 = 'utest_user_2', U3 = 'utest_user_3', CUSTOMER = 'utest_customer';
    for (const k of Object.keys(localStorage)) if (k.startsWith('ks_')) localStorage.removeItem(k);
    for (const name of ['mkg-khaosat-anon', `mkg-khaosat-${U1}`, `mkg-khaosat-${U2}`, `mkg-khaosat-${U3}`, `mkg-khaosat-${CUSTOMER}`]) {
        await new Promise(r => { const q = indexedDB.deleteDatabase(name); q.onsuccess = q.onerror = q.onblocked = r; });
    }

    const mkProj = (id, name) => ({ id, name, scope: 'private', createdAt: 1, updatedAt: 1 });

    group('1. Chưa đăng nhập → store anon');
    {
        const r = await db.setAccount(null);
        ok('mở store anon', r.storeId === 'anon', r.storeId);
        await db.saveProjects([mkProj('pA', 'Dự án khảo sát trước khi login')]);
        await db.putDoc({ id: 'dA', projectId: 'pA', type: 'plan', name: 'MB 1', createdAt: 1, updatedAt: 1 });
        ok('ghi/đọc được ở anon', (await db.loadProjects()).length === 1);
        ok('doc index hoạt động', (await db.listDocs('pA')).length === 1);
    }

    group('2. Đăng nhập lần đầu → nhận dữ liệu anon vào tài khoản');
    {
        const r = await db.setAccount(U1);
        ok('đổi sang store của user 1', r.storeId === U1, r.storeId);
        ok('báo đã nhận dữ liệu', r.adopted > 0, `adopted=${r.adopted}`);
        const ps = await db.loadProjects();
        ok('dự án tạo lúc chưa login đi theo tài khoản', ps.length === 1 && ps[0].id === 'pA', JSON.stringify(ps));
        ok('doc cũng đi theo', (await db.listDocs('pA')).length === 1);
    }
    {
        // Không được nhận lần hai: store anon phải đã rỗng.
        await db.setAccount('anon');
        ok('store anon đã được dọn sau khi nhận', (await db.loadProjects()).length === 0);
    }

    group('2b. Tài khoản đã có dữ liệu vẫn phải nhận đủ dữ liệu anon');
    {
        // Kho tài khoản đã có dữ liệu từ cloud/lần dùng trước — đây chính là ca từng làm
        // setAccount bỏ qua toàn bộ anon và khiến login xong trông như mất sạch.
        await db.setAccount(U3);
        await db.saveProjects([mkProj('pCloud', 'Đã có trong tài khoản')]);
        await db.putDoc({ id: 'dCloud', projectId: 'pCloud', type: 'plan', name: 'Cloud', createdAt: 2, updatedAt: 2 });
        await db.addTombstone('goneCloud', 'doc', Date.now());
        await db.markPending('pCloud', 'project');
        await db.setMeta({ scopeDirty: ['pCloud'], lastSyncAt: 5000 });

        await db.setAccount(null);
        await db.saveProjects([mkProj('pOffline', 'Làm trước khi đăng nhập')]);
        await db.putDoc({ id: 'dOffline', projectId: 'pOffline', type: 'photo', name: 'Offline', createdAt: 3, updatedAt: 3 });
        await db.addTombstone('goneOffline', 'doc', Date.now() + 1000);
        await db.markPending('pOffline', 'project');
        await db.setMeta({ scopeDirty: ['pOffline'], lastSyncAt: 1000 });

        // Mô phỏng đúng máy đã dính bug cũ: cờ active đã bị đổi sang uid ở lần login
        // trước, nhưng dữ liệu thật vẫn còn trong IndexedDB anon.
        localStorage.setItem('ks_store_id', U3);
        const r = await db.setAccount(U3);
        const ps = await db.loadProjects();
        const docs = await db.listAllDocs();
        const tombstones = await db.getTombstones();
        const pending = await db.getPending();
        const meta = await db.getMeta();
        ok('tự cứu được dù cờ active không còn là anon', r.adopted === 2, `adopted=${r.adopted}`);
        ok('giữ project đã có trong tài khoản', ps.some(p => p.id === 'pCloud'), JSON.stringify(ps));
        ok('khôi phục project làm trước login', ps.some(p => p.id === 'pOffline'), JSON.stringify(ps));
        ok('giữ doc cloud và nhận doc offline', ['dCloud', 'dOffline'].every(id => docs.some(d => d.id === id)), JSON.stringify(docs.map(d => d.id)));
        ok('hợp nhất dấu xóa, không làm item hồi sinh', ['goneCloud', 'goneOffline'].every(id => tombstones.some(t => t.item_id === id)));
        ok('hợp nhất hàng đợi chưa sync', ['pCloud', 'pOffline'].every(id => pending.some(p => p.item_id === id)));
        ok('hợp nhất scopeDirty', ['pCloud', 'pOffline'].every(id => meta.scopeDirty.includes(id)), JSON.stringify(meta.scopeDirty));
        ok('giữ mốc sync mới hơn của tài khoản', meta.lastSyncAt === 5000, String(meta.lastSyncAt));

        await db.setAccount('anon');
        ok('chỉ dọn anon sau khi merge đã kiểm chứng', (await db.loadProjects()).length === 0 && (await db.listAllDocs()).length === 0);
    }

    group('2c. Cổng khách không được nhận dữ liệu nội bộ ẩn danh');
    {
        await db.setAccount(null);
        await db.saveProjects([mkProj('pInternal', 'Dữ liệu nhân viên chưa đăng nhập')]);
        await db.putDoc({ id: 'dInternal', projectId: 'pInternal', type: 'plan', name: 'Nội bộ', createdAt: 4, updatedAt: 4 });

        const r = await db.setAccount(CUSTOMER, { adoptAnon: false });
        ok('mở đúng kho riêng của khách', r.storeId === CUSTOMER, r.storeId);
        ok('khách không nhận project ẩn danh', (await db.loadProjects()).length === 0);
        ok('khách không nhận doc ẩn danh', (await db.listAllDocs()).length === 0);
        ok('không báo đã nhận nhầm dữ liệu', r.adopted === 0, `adopted=${r.adopted}`);

        await db.setAccount('anon');
        ok('dữ liệu nội bộ vẫn nguyên trong kho anon', (await db.loadProjects()).some(p => p.id === 'pInternal'));
        ok('doc nội bộ vẫn nguyên trong kho anon', (await db.listAllDocs()).some(d => d.id === 'dInternal'));
        await db.saveProjects([]);
        await db.deleteDoc('dInternal');
    }

    group('3. Tài khoản khác trên cùng máy — không được thấy dữ liệu người trước');
    {
        await db.setAccount(U1);
        await db.saveProjects([mkProj('pA', 'Dự án của user 1'), mkProj('pB', 'Biệt thự khách VIP')]);

        await db.setAccount(U2);
        const ps = await db.loadProjects();
        ok('user 2 thấy store RỖNG (không rò rỉ)', ps.length === 0, JSON.stringify(ps.map(p => p.name)));
        ok('user 2 không thấy doc của user 1', (await db.listAllDocs()).length === 0);
        await db.saveProjects([mkProj('pC', 'Dự án của user 2')]);

        await db.setAccount(U1);
        const back = await db.loadProjects();
        ok('quay lại user 1 vẫn còn đủ dữ liệu', back.length === 2 && back.some(p => p.id === 'pB'), JSON.stringify(back.map(p => p.id)));
        ok('user 1 không thấy dự án của user 2', !back.some(p => p.id === 'pC'));
    }

    group('4. Đăng xuất giữ nguyên store đang xem');
    {
        await db.setAccount(U1);
        ok('lastStoreId nhớ đúng tài khoản', db.lastStoreId() === U1, db.lastStoreId());
        // App khi boot mà chưa đăng nhập sẽ gọi setAccount(lastStoreId()).
        const r = await db.setAccount(db.lastStoreId());
        ok('boot sau khi đăng xuất vẫn mở đúng store', r.storeId === U1);
        ok('dữ liệu vẫn thấy được sau khi đăng xuất', (await db.loadProjects()).length === 2);
        ok('không nhận nhầm dữ liệu lần nữa', r.adopted === 0);
    }

    group('5. Tombstone: ghi kể cả khi offline, tự dọn khi quá hạn');
    {
        await db.setAccount(U2);
        await db.addTombstone('x1', 'doc', Date.now());
        await db.addTombstone('x2', 'project', Date.now() - 100 * 24 * 3600 * 1000); // 100 ngày trước
        const ts = await db.getTombstones();
        ok('tombstone mới còn giữ', ts.some(t => t.item_id === 'x1'));
        ok('tombstone quá 90 ngày bị dọn', !ts.some(t => t.item_id === 'x2'), JSON.stringify(ts));
        await db.addTombstone('x1', 'doc', Date.now() + 5000);
        const ts2 = await db.getTombstones();
        ok('addTombstone lại không tạo bản trùng', ts2.filter(t => t.item_id === 'x1').length === 1);
        await db.removeTombstones(['x1']);
        ok('xóa tombstone được', (await db.getTombstones()).length === 0);
    }

    group('6. mutateProjects — chống mất dữ liệu khi sync chạy song song');
    {
        await db.setAccount(U2);
        await db.saveProjects([mkProj('p1', 'A')]);
        // Mô phỏng: sync đọc snapshot (chỉ có p1), người dùng tạo p2 trong lúc sync chạy,
        // rồi sync ghi kết quả. Nếu ghi từ snapshot cũ thì p2 mất.
        const snapshot = await db.loadProjects();
        await db.mutateProjects(cur => [mkProj('p2', 'Tạo chen vào giữa'), ...cur]);
        await db.mutateProjects(cur => {
            const map = new Map(cur.map(p => [p.id, p]));
            for (const p of snapshot) map.set(p.id, { ...p, name: p.name + ' (từ cloud)' });
            return [...map.values()];
        });
        const final = await db.loadProjects();
        ok('dự án tạo chen vào giữa KHÔNG bị mất', final.some(p => p.id === 'p2'), JSON.stringify(final.map(p => p.id)));
        ok('dữ liệu kéo về vẫn được áp', final.find(p => p.id === 'p1')?.name === 'A (từ cloud)');
    }

    group('7. Ghi đồng thời không được làm rơi project/doc khỏi index');
    {
        await db.setAccount(U2);
        await db.saveProjects([]);
        await Promise.all([
            db.mutateProjects(cur => [...cur, mkProj('q1', 'Q1')]),
            db.mutateProjects(cur => [...cur, mkProj('q2', 'Q2')]),
        ]);
        const ps = await db.loadProjects();
        ok('hai mutateProjects đồng thời đều còn', ['q1', 'q2'].every(id => ps.some(p => p.id === id)), JSON.stringify(ps.map(p => p.id)));

        await Promise.all([
            db.putDoc({ id: 'qd1', projectId: 'q1', type: 'plan', createdAt: 1, updatedAt: 1 }),
            db.putDoc({ id: 'qd2', projectId: 'q2', type: 'photo', createdAt: 1, updatedAt: 1 }),
        ]);
        const docs = await db.listAllDocs();
        ok('hai putDoc đồng thời đều còn trong index', ['qd1', 'qd2'].every(id => docs.some(d => d.id === id)), JSON.stringify(docs.map(d => d.id)));
    }

    // Dọn rác test
    for (const k of Object.keys(localStorage)) if (k.startsWith('ks_')) localStorage.removeItem(k);
    document.getElementById('out').innerHTML = lines.join('\n') + `\n\n<b>${pass} pass, ${fail} fail</b>`;
    document.title = fail ? `${fail} FAIL` : `${pass} pass`;
</script>
